function meaningOptions(w,pool){
  const syn=String(w.syn||'').split(/[•,;]/).map(x=>x.trim()).filter(Boolean);
  const ant=String(w.ant||'').split(/[•,;]/).map(x=>x.trim()).filter(Boolean);
  const correct=syn[0]||String(w.answer||w.prompt||'').trim();
  const source=[...(pool||[]),...(DATA.words||[])];
  const distractors=[];
  source.forEach(x=>{
    String(x.syn||'').split(/[•,;]/).map(y=>y.trim()).filter(Boolean).forEach(y=>distractors.push(y));
    String(x.ant||'').split(/[•,;]/).map(y=>y.trim()).filter(Boolean).forEach(y=>distractors.push(y));
  });
  ant.forEach(x=>distractors.push(x));
  const unique=[]; const seen=new Set([correct.toLowerCase(),String(w.prompt||'').toLowerCase()]);
  distractors.forEach(x=>{const k=x.toLowerCase();if(x&&!seen.has(k)){seen.add(k);unique.push(x)}});
  const opts=[correct,...unique.slice(0,3)];
  while(opts.length<4)opts.push(['Practical','Careless','Temporary','Clear'][opts.length-1]);
  return opts.slice(0,4).sort(()=>Math.random()-.5);
}
function renderQuiz(w,body){
  w=currentWords[quizIndex]||currentWords[0];
  currentIndex=quizIndex;
  const isV=(w.contentType||'Vocabulary').toLowerCase()==='vocabulary';
  const correctAnswer=isV?(String(w.syn||'').split(/[•,;]/).map(x=>x.trim()).filter(Boolean)[0]||String(w.answer||'')):String(w.answer||'');
  let opts=isV?meaningOptions(w,currentWords):(w.options||'').split('|').map(x=>x.trim()).filter(Boolean);
  if(!opts.includes(correctAnswer))opts=[correctAnswer,...opts];
  if(opts.length<4)opts=opts.concat(['Option A','Option B','Option C','Option D'].filter(x=>!opts.includes(x))).slice(0,4);
  opts=opts.slice(0,4).sort(()=>Math.random()-.5);
  const question=isV
    ?`What does “${escapeHtml(w.prompt)}” mean?`
    :`Choose the correct answer for:<br/><span style="font-size:.9em">${escapeHtml(w.prompt)}</span>`;
  body.innerHTML=`<div class="word-card quiz-card">
    <div class="quiz-qno">Question ${quizIndex+1} of ${currentWords.length}</div>
    <div class="question">${question}</div>
    <div class="options">${opts.map((c,i)=>`<button class="option" data-value="${escapeHtml(c)}" onclick="selectAnswer(this,'${escapeJs(c)}')"><span class="option-letter">${String.fromCharCode(65+i)}</span><span>${escapeHtml(c)}</span></button>`).join('')}</div>
    <div id="feedback" class="feedback" aria-live="polite"></div>
    <div class="ws-actions"><button id="continueBtn" class="btn primary" onclick="continueQuiz()" style="display:none">Continue →</button></div>
  </div>`
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function escapeJs(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function selectAnswer(btn,val){
  if(answered)return;
  answered=true; selected=val;
  const w=currentWords[quizIndex];
  const isV=(w.contentType||'Vocabulary').toLowerCase()==='vocabulary';
  const correctAnswer=isV?(String(w.syn||'').split(/[•,;]/).map(x=>x.trim()).filter(Boolean)[0]||String(w.answer||'')):String(w.answer||'');
  const ok=selected===correctAnswer;
  document.querySelectorAll('.option').forEach(x=>{x.disabled=true;if(x.dataset.value===correctAnswer)x.classList.add('correct');if(x===btn&&!ok)x.classList.add('wrong')});
  if(ok){quizScore++;state.points+=10;state.mastery[w.id]=Math.max(Number(state.mastery[w.id]||0),1)}else{quizWrong.push(w.id)}
  quizResults.push({id:w.id,word:w.prompt,selected:val,correct:correctAnswer,ok});
  save();
  const f=document.getElementById('feedback');
  if(f){f.innerHTML=ok?'✓ Correct! <b>+10 points</b>':'✗ Not quite. The correct answer is <b>'+escapeHtml(correctAnswer)+'</b>';f.className='feedback '+(ok?'ok':'bad')+' answer-feedback'}
  const next=document.getElementById('continueBtn');
  if(next){next.style.display='inline-flex';next.textContent=quizIndex<currentWords.length-1?'Continue →':'See Results →'}
}

<script type="text/javascript">/* CareerVocab backend configuration.
   Set API_URL to your deployed Google Apps Script Web App URL.
   Never put Google/Firebase private keys or service-account secrets here. */
const CAREERVOCAB_CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbzupDqhjxdog_2zWgrzQ8Iq9SKsIhUbkf2Ogj361kAlM44XMabUZncrpV0Eeti1Urtx4g/exec',
  APP_VERSION: '1.6.0'
};
const CV_CACHE_KEY='cv_live_cache_v2';

function cvSaveCache(data){
  try{
    localStorage.setItem(CV_CACHE_KEY,JSON.stringify({
      books:data.books||[],
      words:data.words||[],
      jobs:data.jobs||[],
      notices:data.notices||[],
      ads:data.ads||[],
      settings:data.settings||[],
      savedAt:Date.now()
    }));
  }catch(e){}
}

function cvLoadCache(){
  try{
    const c=JSON.parse(localStorage.getItem(CV_CACHE_KEY)||'null');
    if(!c || !Array.isArray(c.words)) return false;
    if(Array.isArray(c.books)) DATA.books=c.books;

    const words=(c.words||[]).map(x=>({
      ...x,
      id:String(x.id??x.ID??''),
      category:'vocabulary',
      contentType:'Vocabulary',
      book:String(x.bookId??x.Book??x.book??'General'),
      quiz:Number(x.quizId??x.Quiz??x.quiz??1),
      prompt:x.word??x.Word??'',
      answer:x.word??x.Word??'',
      meaning:x.meaningBn??x.Meaning??x.meaning??'',
      syn:x.synonyms??x.Synonym??x.synonym??'',
      ant:x.antonyms??x.Antonym??x.antonym??'',
      mn:x.mnemonic??x.Mnemonic??x.mnemonic??'',
      sentence:x.example??x.Sentence??x.sentence??'',
      pronunciation:x.pronunciation??x.Pronunciation??''
    }));

    DATA.content=words;
    if(Array.isArray(c.jobs)) DATA.jobs=c.jobs;
    if(Array.isArray(c.notices)) DATA.notices=c.notices;
    if(Array.isArray(c.ads)) DATA.ads=c.ads;
    if(Array.isArray(c.settings)) DATA.settings=c.settings;
    normalizeData();
    return true;
  }catch(e){ return false; }
}

async function syncFromServer(opts){
  opts=opts||{};
  const silent=!!opts.silent;
  if(!CAREERVOCAB_CONFIG.API_URL){
    if(!silent) toast('API URL is not configured yet');
    return false;
  }

  let controller=null,timer=null;
  try{
    if('AbortController' in window){
      controller=new AbortController();
      timer=setTimeout(()=>controller.abort(),8000);
    }

    const res=await fetch(
      CAREERVOCAB_CONFIG.API_URL + '?action=bootstrap&_='+Date.now(),
      {
        cache:'no-store',
        signal:controller?controller.signal:undefined
      }
    );
    if(!res.ok) throw new Error('API request failed');

    const data=await res.json();

    if(Array.isArray(data.books)) DATA.books=data.books;

    const words=(data.words||[]).map(x=>({
      ...x,
      id:String(x.id??x.ID??''),
      category:'vocabulary',
      contentType:'Vocabulary',
      book:String(x.bookId??x.Book??x.book??'General'),
      quiz:Number(x.quizId??x.Quiz??x.quiz??1),
      prompt:x.word??x.Word??'',
      answer:x.word??x.Word??'',
      meaning:x.meaningBn??x.Meaning??x.meaning??'',
      syn:x.synonyms??x.Synonym??x.synonym??'',
      ant:x.antonyms??x.Antonym??x.antonym??'',
      mn:x.mnemonic??x.Mnemonic??x.mnemonic??'',
      sentence:x.example??x.Sentence??x.sentence??'',
      pronunciation:x.pronunciation??x.Pronunciation??''
    }));

    DATA.content=words;
    if(data.jobs) DATA.jobs=data.jobs;
    if(Array.isArray(data.notices)) DATA.notices=data.notices;
    if(Array.isArray(data.ads)) DATA.ads=data.ads;
    if(Array.isArray(data.settings)) DATA.settings=data.settings;

    normalizeData();
    cvSaveCache(data);
    localStorage.setItem('cv_last_sync',new Date().toISOString());

    if(route==='home') renderHome();
    else if(route==='books') renderBooks();
    else if(route==='jobs') renderJobs();
    else if(route==='profile') renderProfile();

    if(!silent) toast('Content synced');
    return true;
  }catch(e){
    if(!silent) toast('Sync failed — using saved content');
    return false;
  }finally{
    if(timer) clearTimeout(timer);
  }
}

let cvSyncRunning=false;
let cvLastAutoSync=0;

async function autoSyncCareerVocab(force){
  if(!CAREERVOCAB_CONFIG.API_URL || cvSyncRunning) return;
  const now=Date.now();
  if(!force && now-cvLastAutoSync<15000) return;
  cvLastAutoSync=now;
  cvSyncRunning=true;
  try{
    await syncFromServer({silent:true});
  }finally{
    cvSyncRunning=false;
  }
}

function bootCareerVocab(){
  cvLoadCache();

  /* Show saved Sheet content immediately; never wait for Google Sheets. */
  renderHome();
  maybeShowRandomWord();
  showPopupAd();

  /* Mobile-safe background refresh: try immediately, then retry if the first
     request is delayed by mobile network / browser startup. Never block the UI. */
  if(CAREERVOCAB_CONFIG.API_URL){
    const bootRefresh=()=>{
      autoSyncCareerVocab(true);
      setTimeout(()=>autoSyncCareerVocab(true),1200);
      setTimeout(()=>autoSyncCareerVocab(true),3500);
      setTimeout(()=>autoSyncCareerVocab(true),8000);
    };
    bootRefresh();
    window.addEventListener('online',()=>bootRefresh());
    window.addEventListener('focus',()=>autoSyncCareerVocab(true));
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='visible') autoSyncCareerVocab(true);
    });
    window.addEventListener('pageshow',()=>bootRefresh());
    setInterval(()=>autoSyncCareerVocab(false),60000);
  }
}

function configureApi(){
  const current=CAREERVOCAB_CONFIG.API_URL||'';
  const url=prompt('Google Apps Script Web App URL:',current);
  if(url!==null){
    localStorage.setItem('cv_api_url',url.trim());
    CAREERVOCAB_CONFIG.API_URL=url.trim();
    toast('API URL saved');
  }
}

bootCareerVocab();</script>

    if(!cfg.enabled || !cfg.apiKey || !cfg.projectId || !cfg.messagingSenderId || !cfg.appId || !cfg.vapidKey) return false;
    if(!window.firebase) return false;
    if(!firebase.apps.length) firebase.initializeApp({apiKey:cfg.apiKey,authDomain:cfg.authDomain,projectId:cfg.projectId,storageBucket:cfg.storageBucket,messagingSenderId:cfg.messagingSenderId,appId:cfg.appId});
    messaging=firebase.messaging();
    messagingReady=true;
    try{
      messaging.onMessage(payload=>{
        const n=payload.notification||payload.data||{};
        if(n.title) toast('🔔 '+n.title+(n.body?' — '+n.body:''));
      });
    }catch(e){}
    return true;
  }
  async function registerTokenOnServer(token){
    const api=(window.CAREERVOCAB_CONFIG&&CAREERVOCAB_CONFIG.API_URL)||'';
    if(!api || !token) return false;
    try{
      const res=await fetch(api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'registerToken',token:token,platform:'web'})});
      const data=await res.json();
      return !!data.ok;
    }catch(e){
      console.warn('CareerVocab FCM token registration failed',e);
      return false;
    }
  }
  window.enableCareerVocabNotifications=async function(){
    const b=document.getElementById('notificationBtn');
    if(b){b.disabled=true;b.querySelector('strong').textContent='Enabling Notifications…';}
    try{
      if(!('Notification' in window)){toast('Notifications are not supported in this browser');return;}
      if(Notification.permission==='denied'){toast('Notifications are blocked. Enable them in browser settings.');return;}
      const ok=await initMessaging();
      if(!ok) throw new Error('Firebase Messaging is not configured');
      const permission=await Notification.requestPermission();
      if(permission!=='granted'){toast('Notification permission was not granted');return;}
      const registration=await registerMessagingSW();
      const token=await messaging.getToken({vapidKey:cfg.vapidKey,serviceWorkerRegistration:registration});
      if(!token) throw new Error('No FCM token returned');
      localStorage.setItem(key,token);
      localStorage.setItem('cv_fcm_permission','granted');
      const registered=await registerTokenOnServer(token);
      setButton('Notifications Enabled',true);
      toast(registered?'✓ Notifications enabled':'✓ Notifications enabled (server sync pending)');
    }catch(e){
      console.error('CareerVocab notification setup failed',e);
      setButton('Enable Notifications',false);
      const msg=(e&&e.message)?e.message:String(e||'Unknown error');
      const name=(e&&e.name)?e.name:'';
      console.error('CareerVocab FCM diagnostic:',{name,message:msg,permission:('Notification' in window?Notification.permission:'unsupported'),basePath:basePath(),serviceWorkerSupported:('serviceWorker' in navigator),pushSupported:('PushManager' in window)});
      toast('Notification setup failed: '+(name?name+': ':'')+msg.slice(0,120));
    }
  };
  async function boot(){
    if('serviceWorker' in navigator){
      if(cfg.enabled) { try{ await initMessaging(); }catch(e){} }
    }
    if('Notification' in window && Notification.permission==='granted' && localStorage.getItem(key)){
      setButton('Notifications Enabled',true);
      registerTokenOnServer(localStorage.getItem(key));
    }
  }
  window.addEventListener('load',boot);
})();
</script>
